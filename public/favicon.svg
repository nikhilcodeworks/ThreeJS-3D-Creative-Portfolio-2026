<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Earth Globe Gradient -->
    <radialGradient id="earthGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Neon Orbital Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Back Arc of Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="62"
    transform="rotate(-28 256 256)"
    fill="none" stroke="url(#ringGrad)" stroke-width="14"
    stroke-dasharray="290 380" stroke-dashoffset="135"
    opacity="0.4" />

  <!-- Earth Globe Body -->
  <circle cx="256" cy="256" r="130" fill="url(#earthGrad)" />

  <!-- Stylized Landmass Contours -->
  <g fill="#34d399" opacity="0.35">
    <path d="M 205,185 Q 225,195 215,225 Q 205,245 220,270 Q 230,290 215,315 Q 200,295 195,260 Q 190,220 205,185 Z" />
    <path d="M 260,175 Q 300,170 315,195 Q 325,220 300,235 Q 275,220 280,195 Z" />
    <path d="M 270,240 Q 305,250 295,295 Q 280,325 265,310 Q 260,270 270,240 Z" />
  </g>

  <!-- Atmosphere Rim Sheen -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.6" />

  <!-- Front Arc of Orbital Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="62"
    transform="rotate(-28 256 256)"
    fill="none" stroke="url(#ringGrad)" stroke-width="16"
    stroke-linecap="round"
    stroke-dasharray="350 320" stroke-dashoffset="-50"
    filter="url(#glow)" />

  <!-- Glowing Satellite Sphere -->
  <circle cx="395" cy="182" r="15" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="395" cy="182" r="7" fill="#ffffff" />

  <!-- Monogram NK. Centerpiece -->
  <text x="256" y="280"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="94"
    font-weight="900"
    letter-spacing="-2"
    fill="#ffffff"
    text-anchor="middle"
    filter="drop-shadow(0 4px 10px rgba(0,0,0,0.85))">NK<tspan fill="#22d3ee">.</tspan></text>
</svg>
